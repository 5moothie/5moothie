<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Global timing set to 15 seconds */
    :root {
      --dur: 15s;
    }

    /* Background stars dimming animation */
    .bg-star {
      fill: #fce570;
      opacity: 0;
      animation: bgStarAnim var(--dur) linear infinite;
    }
    @keyframes bgStarAnim {
      0% { opacity: 0; }
      10%, 20% { opacity: 1; }
      53.33%, 100% { opacity: 0.15; }
    }

    /* 
      Umbrella Stars (Nodes) 
      They are fully visible from the start and perfectly mimic the background 
      stars' opacity curve (dimming from 20% to 53.33%) until their exact connection time.
    */
    .node {
      opacity: 0;
      animation-duration: var(--dur);
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    /* Node 0: Root (Top) - Hit at 20% (3s) */
    .n0 { animation-name: node0Anim; }
    @keyframes node0Anim {
      0% { opacity: 0; fill: #fce570; r: 2; }
      10%, 19.99% { opacity: 1; fill: #fce570; r: 2; }
      20% { opacity: 1; fill: #fff9c4; r: 4.5; }
      23%, 100% { opacity: 1; fill: #fff9c4; r: 3.5; }
    }

    /* Node 1: Inner canopy ribs - Hit at 28.33% (4.25s). Matches bg dimming up to ~0.79 opacity */
    .n1 { animation-name: node1Anim; }
    @keyframes node1Anim {
      0% { opacity: 0; fill: #fce570; r: 2; }
      10%, 20% { opacity: 1; fill: #fce570; r: 2; }
      28.32% { opacity: 0.79; fill: #fce570; r: 2; }
      28.33% { opacity: 1; fill: #fff9c4; r: 4.5; }
      31%, 100% { opacity: 1; fill: #fff9c4; r: 3.5; }
    }

    /* Node 2: Outer canopy & Upper shaft - Hit at 36.66% (5.5s). Matches bg dimming up to ~0.58 opacity */
    .n2 { animation-name: node2Anim; }
    @keyframes node2Anim {
      0% { opacity: 0; fill: #fce570; r: 2; }
      10%, 20% { opacity: 1; fill: #fce570; r: 2; }
      36.65% { opacity: 0.58; fill: #fce570; r: 2; }
      36.66% { opacity: 1; fill: #fff9c4; r: 4.5; }
      39%, 100% { opacity: 1; fill: #fff9c4; r: 3.5; }
    }

    /* Node 3: Lower shaft - Hit at 45% (6.75s). Matches bg dimming up to ~0.36 opacity */
    .n3 { animation-name: node3Anim; }
    @keyframes node3Anim {
      0% { opacity: 0; fill: #fce570; r: 2; }
      10%, 20% { opacity: 1; fill: #fce570; r: 2; }
      44.99% { opacity: 0.36; fill: #fce570; r: 2; }
      45% { opacity: 1; fill: #fff9c4; r: 4.5; }
      48%, 100% { opacity: 1; fill: #fff9c4; r: 3.5; }
    }

    /* Node 4: Handle hook tip - Hit at 53.33% (8s). Matches bg dimming all the way down to 0.15 */
    .n4 { animation-name: node4Anim; }
    @keyframes node4Anim {
      0% { opacity: 0; fill: #fce570; r: 2; }
      10%, 20% { opacity: 1; fill: #fce570; r: 2; }
      53.32% { opacity: 0.15; fill: #fce570; r: 2; }
      53.33% { opacity: 1; fill: #fff9c4; r: 4.5; }
      56%, 100% { opacity: 1; fill: #fff9c4; r: 3.5; }
    }

    /* Lines for the BFS structure */
    .line {
      stroke: #fff9c4;
      stroke-width: 2.5;
      fill: none;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation-duration: var(--dur);
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      animation-fill-mode: forwards;
    }

    /* Level 1: Central and main inner ribs */
    .l1 { animation-name: drawL1; }
    @keyframes drawL1 {
      0%, 20% { stroke-dashoffset: 1; }
      28.33%, 100% { stroke-dashoffset: 0; }
    }

    /* Level 2: Outer ribs and upper shaft */
    .l2 { animation-name: drawL2; }
    @keyframes drawL2 {
      0%, 28.33% { stroke-dashoffset: 1; }
      36.66%, 100% { stroke-dashoffset: 0; }
    }

    /* Level 3: Canopy base arcs and lower shaft */
    .l3 { animation-name: drawL3; }
    @keyframes drawL3 {
      0%, 36.66% { stroke-dashoffset: 1; }
      45%, 100% { stroke-dashoffset: 0; }
    }

    /* Level 4: Handle curve */
    .l4 { animation-name: drawL4; }
    @keyframes drawL4 {
      0%, 45% { stroke-dashoffset: 1; }
      53.33%, 100% { stroke-dashoffset: 0; }
    }

    /* Soft float/pulse applied to the whole connected shape from 8s to 15s */
    .umbrella-group {
      transform-origin: 250px 250px;
      animation: softPulse var(--dur) ease-in-out infinite;
    }
    @keyframes softPulse {
      0%, 53.33% {
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 0 0px rgba(255, 249, 196, 0));
        opacity: 1;
      }
      65% {
        transform: translateY(-4px) scale(1.02);
        filter: drop-shadow(0 0 6px rgba(255, 249, 196, 0.7));
        opacity: 0.9;
      }
      76% {
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 0 0px rgba(255, 249, 196, 0));
        opacity: 1;
      }
      88% {
        transform: translateY(-4px) scale(1.02);
        filter: drop-shadow(0 0 6px rgba(255, 249, 196, 0.7));
        opacity: 0.9;
      }
      100% {
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 0 0px rgba(255, 249, 196, 0));
        opacity: 1;
      }
    }
  </style>

  <!-- Deep space background -->
  <rect width="100%" height="100%" fill="#0a0e17" />

  <!-- Dimming Background Stars -->
  <g id="background-stars">
    <circle cx="50" cy="50" r="1.5" class="bg-star" style="animation-delay: 0.1s" />
    <circle cx="120" cy="80" r="2" class="bg-star" style="animation-delay: 0.3s" />
    <circle cx="380" cy="40" r="1.2" class="bg-star" style="animation-delay: 0.2s" />
    <circle cx="450" cy="110" r="2.5" class="bg-star" style="animation-delay: 0.4s" />
    <circle cx="30" cy="200" r="1.5" class="bg-star" style="animation-delay: 0.1s" />
    <circle cx="90" cy="350" r="2" class="bg-star" style="animation-delay: 0.5s" />
    <circle cx="420" cy="300" r="1" class="bg-star" style="animation-delay: 0.2s" />
    <circle cx="460" cy="450" r="2" class="bg-star" style="animation-delay: 0.6s" />
    <circle cx="150" cy="420" r="1.5" class="bg-star" style="animation-delay: 0.1s" />
    <circle cx="320" cy="460" r="2" class="bg-star" style="animation-delay: 0.3s" />
    <circle cx="300" cy="80" r="1.5" class="bg-star" style="animation-delay: 0.4s" />
    <circle cx="80" cy="140" r="1" class="bg-star" style="animation-delay: 0.2s" />
    <circle cx="200" cy="50" r="2.5" class="bg-star" style="animation-delay: 0.5s" />
    <circle cx="350" cy="150" r="1.5" class="bg-star" style="animation-delay: 0.1s" />
    <circle cx="400" cy="380" r="2" class="bg-star" style="animation-delay: 0.7s" />
    <circle cx="50" cy="400" r="1.5" class="bg-star" style="animation-delay: 0.2s" />
    <circle cx="220" cy="440" r="2" class="bg-star" style="animation-delay: 0.4s" />
    <circle cx="110" cy="280" r="1" class="bg-star" style="animation-delay: 0.3s" />
    <circle cx="370" cy="270" r="2.5" class="bg-star" style="animation-delay: 0.6s" />
    <circle cx="480" cy="220" r="1.5" class="bg-star" style="animation-delay: 0.1s" />
    <circle cx="180" cy="110" r="1.2" class="bg-star" style="animation-delay: 0.5s" />
    <circle cx="280" cy="130" r="1.5" class="bg-star" style="animation-delay: 0.2s" />
    <circle cx="130" cy="180" r="2" class="bg-star" style="animation-delay: 0.3s" />
    <circle cx="420" cy="180" r="1" class="bg-star" style="animation-delay: 0.6s" />
    <circle cx="70" cy="250" r="2" class="bg-star" style="animation-delay: 0.1s" />
    <circle cx="450" cy="340" r="1.5" class="bg-star" style="animation-delay: 0.4s" />
    <circle cx="180" cy="300" r="1" class="bg-star" style="animation-delay: 0.2s" />
    <circle cx="330" cy="320" r="2" class="bg-star" style="animation-delay: 0.7s" />
  </g>

  <!-- Umbrella Formation Group -->
  <g class="umbrella-group" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- LEVEL 1 EDGES: Inner Ribs -->
    <line x1="250" y1="100" x2="175" y2="220" class="line l1" pathLength="1" />
    <line x1="250" y1="100" x2="250" y2="220" class="line l1" pathLength="1" />
    <line x1="250" y1="100" x2="325" y2="220" class="line l1" pathLength="1" />

    <!-- LEVEL 2 EDGES: Outer Ribs & Upper Shaft -->
    <line x1="250" y1="100" x2="100" y2="220" class="line l2" pathLength="1" />
    <line x1="250" y1="100" x2="400" y2="220" class="line l2" pathLength="1" />
    <line x1="250" y1="220" x2="250" y2="310" class="line l2" pathLength="1" />

    <!-- LEVEL 3 EDGES: Canopy Arcs & Lower Shaft -->
    <path d="M 100 220 Q 137.5 190 175 220" class="line l3" pathLength="1" />
    <path d="M 175 220 Q 212.5 190 250 220" class="line l3" pathLength="1" />
    <path d="M 250 220 Q 287.5 190 325 220" class="line l3" pathLength="1" />
    <path d="M 325 220 Q 362.5 190 400 220" class="line l3" pathLength="1" />
    <line x1="250" y1="310" x2="250" y2="370" class="line l3" pathLength="1" />

    <!-- LEVEL 4 EDGES: Handle Hook -->
    <path d="M 250 370 A 20 20 0 0 1 210 370" class="line l4" pathLength="1" />

    <!-- 
      UMBRELLA STARS (Nodes of the graph) 
      Hardcoded with base radius and color to ensure they render as normal stars 
      immediately before the CSS animations take over.
    -->
    
    <!-- Node 0: Top point -->
    <circle cx="250" cy="100" r="2" fill="#fce570" class="node n0" />
    
    <!-- Node 2: Outer canopy left & right -->
    <circle cx="100" cy="220" r="2" fill="#fce570" class="node n2" />
    <circle cx="400" cy="220" r="2" fill="#fce570" class="node n2" />
    
    <!-- Node 1: Inner canopy -->
    <circle cx="175" cy="220" r="2" fill="#fce570" class="node n1" />
    <circle cx="250" cy="220" r="2" fill="#fce570" class="node n1" />
    <circle cx="325" cy="220" r="2" fill="#fce570" class="node n1" />
    
    <!-- Node 2: Upper shaft node -->
    <circle cx="250" cy="310" r="2" fill="#fce570" class="node n2" />
    
    <!-- Node 3: Lower shaft node -->
    <circle cx="250" cy="370" r="2" fill="#fce570" class="node n3" />
    
    <!-- Node 4: Handle tip -->
    <circle cx="210" cy="370" r="2" fill="#fce570" class="node n4" />
  </g>
</svg>